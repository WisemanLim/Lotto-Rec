[project]
name = "lotto-rec-backend"
version = "0.1.0"
description = "Lotto-Rec — 로또 6/45 통계분석·검증·추천 API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "numpy>=1.26",
  "scipy>=1.12",
  "pandas>=2.2",
  "statsmodels>=0.14",
  "pyarrow>=15",
  "openpyxl>=3.1",
  "networkx>=3.2",
  "mlxtend>=0.23",
  "ruptures>=1.1.9",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6",
  "httpx>=0.27",
  "ruff>=0.5",
  "mypy>=1.10",
  "honcho>=2",
]

# 모든 테스트는 루트 test/ 로 통일 (backend 유닛 = test/backend). tests/ 사용 안 함.
[tool.pytest.ini_options]
testpaths = ["../test/backend"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/api/*" = ["B008"]  # FastAPI Depends() 관용

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
